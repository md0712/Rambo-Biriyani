<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 90" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1e27" />
      <stop offset="50%" stop-color="#e11d24" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#e11d24" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Wings Left -->
  <g fill="url(#goldGrad)">
    <polygon points="12,52 64,52 56,47 22,47" />
    <polygon points="4,58 64,58 56,53 14,53" />
    <polygon points="18,64 64,64 58,59 26,59" />
  </g>

  <!-- Center Star -->
  <polygon points="150,66 153,74 161,74 155,79 157,87 150,82 143,87 145,79 139,74 147,74" fill="url(#goldGrad)" />

  <!-- Wings Right -->
  <g fill="url(#goldGrad)">
    <polygon points="236,52 288,52 278,47 244,47" />
    <polygon points="236,58 296,58 286,53 244,53" />
    <polygon points="236,64 282,64 274,59 242,59" />
  </g>

  <!-- RAMBO Header Text -->
  <text x="150" y="38" font-family="'Montserrat', 'Bebas Neue', 'Arial Black', sans-serif" font-size="44" font-weight="900" font-style="italic" letter-spacing="3" fill="url(#redGrad)" text-anchor="middle" filter="url(#glow)">
    RAMBO
  </text>

  <!-- BIRIYANI Subtitle -->
  <text x="150" y="62" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="20" font-weight="900" letter-spacing="6" fill="url(#goldGrad)" text-anchor="middle">
    BIRIYANI
  </text>
</svg>
